name : CI/CD Pipeline

on:
  push:
     branches:
       - main

jobs:
  build-and-deploy:
     runs-on: ubuntu-latest

     steps:
     - name: Checkout code
       uses: actions/checkout@v3

     - name: Login to Docker Hub
       uses: docker/login-action@v2
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Build Docker Image
       run: docker build -t ramsiddharth/banking-api:latest .

     - name: Push Docker Image
       run: docker push ramsiddharth/banking-api:latest


     - name: Check EC2 availability
       id: check_ec2
       run: |
         nc -zv ${{ secrets.EC2_HOST }} 22 && echo "alive=true" >> $GITHUB_OUTPUT || echo "alive=false" >> $GITHUB_OUTPUT

     - name: Deploy to EC2
       if: steps.check_ec2.outputs.alive == 'true'
       uses: appleboy/ssh-action@v0.1.10
       with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker pull ramsiddharth/banking-api:latest
          docker stop banking-container || true
          docker rm banking-container || true
          docker run -d -p 5000:5000 \
           -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
           --name banking-container \
           ramsiddharth/banking-api:latest 